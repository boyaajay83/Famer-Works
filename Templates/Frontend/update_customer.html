<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update </title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <style>
        body{
            background-color: #706866;
            color: #1f6b0a;
            text-align: center;
        }
        strong{
            color: black;
            font-size: 18px;
            margin-right: 10px;
            margin-left: 20px;
            float: left;
        }
        .customer{
            margin: 10px;
            border-radius: 10px;
            padding: 5px;
        }
        p{
            margin: 10px;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            max-width: 400px;
            min-height: 50px;
            margin-left: auto;
            margin-right: auto;
        }
        input{
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        label{
            background-color: white;
            min-width: 400px;
            text-align: center;
            padding: 6px;
            border-radius: 5px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <form method="post" action="update_customer_details?phone={{customer.Phone_Number}}&Taken_Date={{customer.Taken_Date}}&Name={{customer.Name}}&Quantity={{customer.Quantity}}">
        {% csrf_token %}
        <div class="customer">
            <p><strong>Name :- </strong><strong>{{customer.Name}}</strong></p>
            <p><strong>Phone :- </strong><strong>{{customer.Phone_Number}}</strong></p>
            <p><strong>Quantity :- </strong><strong>{{customer.Quantity}}</strong></p>
            <p><strong>Taken Date :- </strong><strong>{{customer.Taken_Date}}</strong></p>
            <div class="form-group mt-5">
                <label for="return_date"><strong>Return Date</strong></label>
                <input type="date" class="form-control" name="return_date" id="return_date" value="0000-00-00" required>
            </div>
            <div class="form-group">
                <label for="return_time"><strong> Return Time </strong></label>
                <input type="time" class="form-control" name="return_time" id="return_time" value="00:00">
            </div>
            <div class="form-group">
                <label for="given_amount"><strong>Given Amount</strong></label>
                <input type="number" class="form-control" name="given_amount" id="given_amount" placeholder="Given Amount">
            </div>
            <div class="form-group">
                <label for="return_quantity"><strong>Return Quantity</strong></label>
                <input type="number" class="form-control" name="return_quantity" id="return_quantity" placeholder="Return Quantity">
            </div>
            <button class="btn btn-primary">Update</button>
            <a href="/" class="btn btn-danger ml-5">Back</a>
            {%for message in messages%}
            <div class="alert alert-danger" role="alert">
                {{message}}
            </div>
            {%endfor%}
        </div>
    </form>
    <div id="google_translate_element" class="language mt-5"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'te,en', // Add languages here
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
